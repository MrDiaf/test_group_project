<VirtualHost *:80>
    ServerName deals.example.test
    DocumentRoot /var/www/lokala-fynd/frontend/dist

    <Directory /var/www/lokala-fynd/frontend/dist>
        Options -Indexes
        AllowOverride FileInfo Options
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8000/api retry=0 timeout=60
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ErrorLog ${APACHE_LOG_DIR}/lokala-fynd-error.log
    CustomLog ${APACHE_LOG_DIR}/lokala-fynd-access.log combined
</VirtualHost>
